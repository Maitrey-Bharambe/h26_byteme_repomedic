[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "depexit"
version = "0.1.0"
description = "Gemma 4 powered dependency risk analysis that produces verifiable Dependency Exit Capsules"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["packaging>=23"]

[project.scripts]
depexit = "depexit.cli:main"

[tool.setuptools]
packages = ["depexit", "depexit._helpers"]
